[project]
name = "foodtrace"
version = "0.1.0"
description = "FoodTrace — AI-Powered Grocery Intelligence Platform with explainable scoring."
readme = "CLAUDE.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "fastapi-cli>=0.0.7",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "polars>=2.0.0",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pip-licenses>=5.0",
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api/app", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "spec(*ids): requirement IDs from specs/*.md that this test covers",
    "integration: needs the Docker Postgres (docker compose up -d db)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipeline"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "api"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["api/app", "pipeline"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true

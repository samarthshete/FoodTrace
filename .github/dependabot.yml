# Dependency and security update PRs. Minor/patch bumps are grouped into one PR per
# ecosystem each week to keep the noise down; majors get their own PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(deps)" }
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm # pnpm lockfiles are supported under npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(deps)" }
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions:
        patterns: ["*"]

name: PR title

# Squash merges use the PR title as the commit message on main, so it must follow
# Conventional Commits (feat:, fix:, docs:, ...). release-please reads these.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            chore
            ci
            build
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: Start the subject with a lowercase letter and don't end it with a period.
